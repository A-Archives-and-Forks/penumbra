name: Ensure CONTRIBUTING.md is followed

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  check-and-close:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan
        id: search
        run: |
          if grep -rni --exclude="CONTRIBUTING.md" --exclude-dir=".github" "5L0P-F1NG3RPR1NT" .; then
            echo "detected=true" >> $GITHUB_OUTPUT
          else
            echo "detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Close Pull Request
        if: steps.search.outputs.detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "This PR has been automatically closed because of AI generated content being detected."
